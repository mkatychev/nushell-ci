name: Rewrite Dependabot submodule PR title

# Dependabot proposes submodule bumps with abbreviated commit SHAs in the PR
# title, e.g. `chore: bump nushell from `00c9ee0` to `798c55d``. This workflow
# resolves each SHA to the git tag that points at it (via
# `git tag --points-at <sha> | head -n 1` inside the nushell submodule) and
# rewrites the title to use the tag names instead, e.g.
# `chore: bump nushell from `0.115.0` to `0.115.1``.
#
# The rewrite logic runs in Nushell.

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  rewrite-title:
    # Only run for Dependabot submodule bumps of the nushell submodule.
    if: startsWith(github.head_ref, 'dependabot/submodules/nushell-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          submodules: recursive
          # Full history so tags are available for `git tag --points-at`.
          fetch-depth: 0

      - name: Install Nushell
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/mkatychev/nushell-ci/releases/download/0.115.0/nu-installer.sh | sh
          # Expose the installed `nu` binary on PATH for subsequent steps.
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Fetch submodule tags
        working-directory: nushell
        run: git fetch --tags --force origin

      - name: Resolve SHAs to tags and rewrite title
        shell: nu {0}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          let title = $env.PR_TITLE
          print $"Original title: ($title)"

          # Extract the two backticked SHAs from a title of the form:
          #   chore: bump nushell from `<from>` to `<to>`
          let shas = (
            $title
            | parse --regex '`(?<sha>[0-9a-f]+)`'
            | get sha
          )

          if ($shas | length) < 2 {
            print "Could not extract two SHAs from title; leaving title unchanged."
            exit 0
          }

          let from_sha = ($shas | get 0)
          let to_sha = ($shas | get 1)
          print $"from_sha=($from_sha) to_sha=($to_sha)"

          def resolve_tag [sha: string] {
            git -C nushell tag --points-at $sha
            | lines
            | first
            | default ""
          }

          let from_tag = (resolve_tag $from_sha)
          let to_tag = (resolve_tag $to_sha)
          print $"from_tag=($from_tag) to_tag=($to_tag)"

          if ($from_tag | is-empty) or ($to_tag | is-empty) {
            print "One or both commits are not tagged; leaving title unchanged."
            exit 0
          }

          let new_title = (
            $title
            | str replace $"`($from_sha)`" $"`($from_tag)`"
            | str replace $"`($to_sha)`" $"`($to_tag)`"
          )

          if $new_title == $title {
            print "Title unchanged after substitution; nothing to do."
            exit 0
          }

          print $"New title: ($new_title)"
          gh pr edit $env.PR_NUMBER --title $new_title
