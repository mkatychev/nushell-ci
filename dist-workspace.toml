
# Config for 'dist'
[dist]
# Read the commit to be tagged from the submodule at this path
github-releases-submodule-path = "nushell"
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# A URL to use to install `cargo-dist` (with the installer script)
cargo-dist-url-override = "https://github.com/mkatychev/cargo-dist/releases/download/v0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-pc-windows-msvc", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Whether default-features should be enabled with cargo build
default-features = false
# Features to pass to cargo build
features = ["network", "plugin", "rustls-tls", "sqlite"]
precise-builds = true

[workspace]
repository = "https://github.com/mkatychev/nushell-ci"
# Only build the nu package, exclude all plugins
packages = ["nu"]
members = [
  "cargo:nushell",
]
